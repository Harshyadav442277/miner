# Fly.io deployment.
#
# The one setting that matters competitively is min_machines_running = 1.
# Telegraph spot-checks roughly every 20 seconds and revokes routing on a 20%
# score drop, so a machine that scales to zero and cold-starts will read as a
# failure. Never set this to 0.

app = "livecert"
primary_region = "bom"          # Mumbai — closest to the operator

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CACHE_TTL_MS = "60000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertWatch</title>
<style>
  :root{--bg:#0a0a0a;--panel:#111;--line:#222;--fg:#e6e6e6;--dim:#888;--ok:#3ddc84;--warn:#f5a623;--bad:#ff5c5c;--accent:#3ddc84}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{border-bottom:1px solid var(--line);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  h1{margin:0;font-size:16px;letter-spacing:.16em;text-transform:uppercase}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  main{padding:24px;max-width:1100px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
  .stat{background:var(--panel);border:1px solid var(--line);padding:14px}
  .stat .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
  .stat .v{font-size:22px;margin-top:6px}
  form{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  input{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:10px 12px;font:inherit}
  button{background:var(--accent);color:#000;border:0;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:2px 8px;border-radius:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .valid{background:rgba(61,220,132,.15);color:var(--ok)}
  .expired,.invalid,.untrusted,.self_signed,.hostname_mismatch{background:rgba(255,92,92,.15);color:var(--bad)}
  .unreachable,.null{background:rgba(136,136,136,.15);color:var(--dim)}
  .days-ok{color:var(--ok)}.days-warn{color:var(--warn)}.days-bad{color:var(--bad)}
  a{color:var(--accent)}
  .empty{color:var(--dim);padding:30px;text-align:center;border:1px dashed var(--line)}
  .banner{background:rgba(245,166,35,.12);border:1px solid var(--warn);color:var(--warn);padding:12px;margin-bottom:18px;font-size:13px}
  footer{color:var(--dim);font-size:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<header>
  <div>
    <h1>CertWatch</h1>
    <div class="sub">TLS certificate monitoring, answered by the Telegraph network</div>
  </div>
  <div class="sub" id="payer"></div>
</header>
<main>
  <div id="banner"></div>

  <div class="stats">
    <div class="stat"><div class="k">Domains watched</div><div class="v" id="s-domains">–</div></div>
    <div class="stat"><div class="k">Paid requests</div><div class="v" id="s-requests">–</div></div>
    <div class="stat"><div class="k">SSL_VERIFICATION</div><div class="v" id="s-ssl">–</div></div>
    <div class="stat"><div class="k">Spent (USDC)</div><div class="v" id="s-spent">–</div></div>
  </div>

  <form id="add">
    <input id="domain" placeholder="add a domain, e.g. example.com" autocomplete="off">
    <button type="submit">Watch</button>
    <button type="button" class="ghost" id="recheck">Re-check all</button>
  </form>

  <div id="table"></div>

  <footer>
    Every row is a live answer from a Telegraph miner, paid per call via x402 on Base Sepolia.
    <code>signal</code> links to the on-chain record of that answer.
  </footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function daysClass(d){ if(d===null||d===undefined) return ''; if(d<0) return 'days-bad'; if(d<14) return 'days-warn'; return 'days-ok'; }

function render(data){
  $('s-domains').textContent = data.domains.length;
  $('s-requests').textContent = data.totals.requests;
  $('s-ssl').textContent = data.totals.sslVerificationRequests;
  $('s-spent').textContent = '$' + Number(data.totals.spentUsd || 0).toFixed(4);
  $('payer').textContent = data.payer ? 'paying from ' + data.payer.slice(0,6) + '…' + data.payer.slice(-4) : '';

  $('banner').innerHTML = data.keyConfigured ? '' :
    '<div class="banner">EVM_PRIVATE_KEY is not set. Telegraph charges per call via x402, so checks will fail until a funded Base Sepolia wallet is configured. See app/README.md.</div>';

  if(!data.latest.length){
    $('table').innerHTML = '<div class="empty">No checks yet. Add a domain above.</div>';
    return;
  }
  const rows = data.latest.map(c => `
    <tr>
      <td>${esc(c.domain)}</td>
      <td><span class="pill ${esc(c.verdict||'null')}">${esc(c.verdict || (c.error?'error':'—'))}</span></td>
      <td class="${daysClass(c.daysRemaining)}">${c.daysRemaining ?? '—'}</td>
      <td>${esc(c.issuer || '—')}</td>
      <td>${esc(c.validTo || '—')}</td>
      <td>${esc(c.minerName || '—')}</td>
      <td>${esc(c.intent || '—')}</td>
      <td>${c.signalHash ? `<a href="https://devnode.telegraphprotocol.com/engine/v1/signal/${esc(c.signalHash)}" target="_blank" rel="noopener">signal</a>` : '—'}</td>
      <td><button class="ghost" data-del="${esc(c.domain)}">×</button></td>
    </tr>`).join('');
  $('table').innerHTML = `<table><thead><tr>
    <th>Domain</th><th>Verdict</th><th>Days left</th><th>Issuer</th><th>Expires</th>
    <th>Served by</th><th>Intent</th><th>Proof</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;

  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    await fetch('/api/domains?domain=' + encodeURIComponent(b.dataset.del), {method:'DELETE'});
    refresh();
  });
}

async function refresh(){ render(await (await fetch('/api/state')).json()); }

$('add').onsubmit = async (e) => {
  e.preventDefault();
  const d = $('domain').value.trim();
  if(!d) return;
  const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'checking…';
  try { await fetch('/api/domains', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({domain:d})}); $('domain').value=''; await refresh(); }
  finally { btn.disabled = false; btn.textContent = 'Watch'; }
};

$('recheck').onclick = async () => {
  const b = $('recheck'); b.disabled = true; b.textContent = 'checking…';
  try { await fetch('/api/check', {method:'POST'}); await refresh(); }
  finally { b.disabled = false; b.textContent = 'Re-check all'; }
};

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>

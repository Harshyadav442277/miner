# CertWatch — the Track 3 application.
#
# Unlike the miner, this one may scale to zero: nothing spot-checks it, and a cold
# start costs a visitor a second, not our leaderboard score.
#
# Set the payment key as a secret, never in this file:
#   fly secrets set EVM_PRIVATE_KEY=0x...

app = "certwatch"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  STATE_FILE = "/app/data/state.json"
  CHECK_INTERVAL_MS = "21600000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "certwatch_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

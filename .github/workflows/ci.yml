name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  miner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track1-miner/miner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Unit tests only. The live suite calls third-party upstreams directly, and
      # an outage at any of them fails CI with a red herring. Those run on demand
      # instead (uptime.yml).
      - run: npm run test:unit

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  miner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track1-miner/miner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Unit tests only. The live suite calls badssl.com and Open-Meteo directly,
      # and an outage at either fails CI with a red herring — that happened once
      # during development. Those run on a schedule instead (uptime.yml).
      - run: npm run test:unit

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track3-certwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

# CertWatch sweep — the scheduler and the durable store.
#
# A Vercel instance is frozen between requests, so an in-process interval never
# fires reliably, and /tmp does not survive a cold start. Paid Telegraph calls
# made there were being forgotten, which makes spending money on them pointless.
#
# So the sweep runs here instead, and commits its results to
# track3-certwatch/data/history.json. Git is the durable record; Actions is the scheduler.
# Neither can silently lose a paid result.
#
# Nothing runs until EVM_PRIVATE_KEY is set as a repository secret — the job
# checks first and exits cleanly rather than failing a scheduled run every hour.

name: certwatch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certwatch
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is a wallet configured?
        id: gate
        env:
          KEY: ${{ secrets.EVM_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "EVM_PRIVATE_KEY is not set — skipping. Add it as a repository secret to enable paid sweeps."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund
        if: steps.gate.outputs.run == 'true'
        working-directory: track3-certwatch

      - run: npm run build
        if: steps.gate.outputs.run == 'true'
        working-directory: track3-certwatch

      - name: Sweep and record
        if: steps.gate.outputs.run == 'true'
        working-directory: track3-certwatch
        env:
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
          WATCH_DOMAINS: ${{ vars.WATCH_DOMAINS }}
          STATE_FILE: data/history.json
          TELEGRAPH_NODE: https://devnode.telegraphprotocol.com
        run: node dist/sweep.js

      - name: Commit the history
        if: steps.gate.outputs.run == 'true'
        run: |
          if git diff --quiet -- track3-certwatch/data/history.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "Harshyadav442277"
          git config user.email "theageofprimes@gmail.com"
          git add track3-certwatch/data/history.json
          git commit -m "Record CertWatch sweep results"
          git push

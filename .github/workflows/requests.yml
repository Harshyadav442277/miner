# Request log archive, on a hosted runner.
#
# Vercel keeps about an hour of request logs, and the local archiver (C:\Users\hyada\tg-deploy\scores\record.cmd) only
# runs while the owner's PC is awake: nothing was archived 2026-11-24 16:30 to 2026-11-25 08:08 UTC (GAPS G366).
# GitHub's scheduler cannot carry this alone: scores.yml, set to six runs an hour, started about once every few hours
# in Nov 19-25. So one run archives for 5 h 30 min (every 10 minutes, tools/archive-for.sh), keeping the file as the
# `request-archive` artifact after each hour, then dispatches its own successor (a GITHUB_TOKEN may dispatch
# workflow_dispatch). The schedule only restarts a broken chain; a run that finds another archiver running exits.
#
# Each row is what archive-requests.mjs keeps: route, status, time and the categorical log lines (parameter names,
# short-list values, verdicts), never a person's text. Artifacts of this public repository can be downloaded by
# signed-in GitHub users.
#
# Needs the repository secret VERCEL_TOKEN: a Vercel token with access to the wukong4 team (the owner creates it).
# Read the latest archive with:
#   gh run download "$(gh run list --workflow requests.yml -L 1 --json databaseId -q '.[0].databaseId')" -n request-archive

name: requests

on:
  workflow_dispatch:
    inputs:
      prev_run:
        description: "Run id whose request-archive this run continues"
        required: false
  schedule:
    - cron: "41 */2 * * *"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      OUT: archive/requests.jsonl
    steps:
      - name: One archiver at a time
        id: gate
        run: |
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow requests.yml --status in_progress --json databaseId \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.databaseId | tostring) != \"${{ inputs.prev_run }}\")] | length")
          if [ "${others:-0}" -gt 0 ]; then echo "another archiver is running; exiting"; echo "run=0" >> "$GITHUB_OUTPUT"; else echo "run=1" >> "$GITHUB_OUTPUT"; fi
      - name: Require the Vercel token
        id: token
        if: steps.gate.outputs.run == '1'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Repository secret VERCEL_TOKEN is not set; the archiver cannot read Vercel logs."; exit 1; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == '1'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == '1'
        with:
          node-version: "22"
      - name: Install the Vercel CLI
        if: steps.gate.outputs.run == '1'
        run: npm install -g vercel@59.5.0 --no-audit --no-fund
      - name: Continue the previous archive
        if: steps.gate.outputs.run == '1'
        run: |
          mkdir -p archive
          prev="${{ inputs.prev_run }}"
          ids="$prev $(gh run list --repo "$GITHUB_REPOSITORY" --workflow requests.yml -L 10 --json databaseId -q '.[].databaseId')"
          for id in $ids; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n request-archive -D archive 2>/dev/null; then echo "continuing run $id"; break; fi
          done
          touch "$OUT"; wc -l "$OUT"
      - name: Archive, hour 1
        if: steps.gate.outputs.run == '1'
        run: bash track1-miner/tools/archive-for.sh 60 "$OUT" 60
      - name: Keep the archive
        if: "!cancelled() && steps.token.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: request-archive
          path: archive/requests.jsonl
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
      - name: Archive, hour 2
        if: steps.gate.outputs.run == '1'
        run: bash track1-miner/tools/archive-for.sh 60 "$OUT"
      - name: Keep the archive
        if: "!cancelled() && steps.token.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: request-archive
          path: archive/requests.jsonl
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
      - name: Archive, hour 3
        if: steps.gate.outputs.run == '1'
        run: bash track1-miner/tools/archive-for.sh 60 "$OUT"
      - name: Keep the archive
        if: "!cancelled() && steps.token.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: request-archive
          path: archive/requests.jsonl
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
      - name: Archive, hour 4
        if: steps.gate.outputs.run == '1'
        run: bash track1-miner/tools/archive-for.sh 60 "$OUT"
      - name: Keep the archive
        if: "!cancelled() && steps.token.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: request-archive
          path: archive/requests.jsonl
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
      - name: Archive, hours 5-5.5
        if: steps.gate.outputs.run == '1'
        run: bash track1-miner/tools/archive-for.sh 90 "$OUT"
      - name: Keep the archive
        if: "!cancelled() && steps.token.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: request-archive
          path: archive/requests.jsonl
          overwrite: true
          retention-days: 30
          if-no-files-found: warn
      - name: Start the next archiver
        # Not on cancel: cancelling a run is how the chain is stopped.
        if: "!cancelled() && steps.token.outcome == 'success'"
        run: gh workflow run requests.yml --repo "$GITHUB_REPOSITORY" --ref main -f prev_run="$GITHUB_RUN_ID"

# Uptime and routing watch.
#
# The rules require the miner to stay "live and operational throughout Track 3"
# (to 2026-09-07), and Telegraph revokes routing on a 20% score drop with no
# notification. This checks from outside our machine so a laptop being closed
# doesn't mean nobody is watching.
#
# Set these repository variables/secrets before enabling:
#   vars.MINER_BASE_URL    e.g. https://livecert.fly.dev
#   vars.REGISTRATION_ID   the id from the registerMiner receipt (once registered)

name: uptime

# Every 10 minutes. Public repos get unlimited Actions minutes, so the cadence is
# set for fast revocation detection rather than to fit a quota. Telegraph spot-checks
# every ~20s and revokes routing on a 20% score drop with no notification, so the
# window between a failure starting and us knowing about it is what this minimises.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe the miner
        id: probe
        env:
          MINER_BASE_URL: ${{ vars.MINER_BASE_URL }}
          REGISTRATION_ID: ${{ vars.REGISTRATION_ID }}
        run: |
          if [ -z "$MINER_BASE_URL" ]; then
            echo "MINER_BASE_URL is not set — skipping. Set it once the miner is deployed."
            exit 0
          fi
          ARGS="--base-url $MINER_BASE_URL --once"
          if [ -n "$REGISTRATION_ID" ]; then ARGS="$ARGS --registration-id $REGISTRATION_ID"; fi
          node tools/watch.mjs $ARGS

      - name: Full acceptance check
        if: success() && vars.MINER_BASE_URL != ''
        run: node tools/verify-deploy.mjs "${{ vars.MINER_BASE_URL }}"

      - name: Open an issue if the miner is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Miner health check failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime',
            });
            const body = `Automated check failed at ${new Date().toISOString()}.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Spot checks run every ~20s and routing is revoked on a 20% score drop, ` +
              `so this is likely already costing score.`;
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['uptime'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            }

  live-tests:
    # The network-dependent half of the suite, on the uptime cadence rather than
    # on every push, so an upstream blip never blocks a merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: miner
      - run: npm run test:live
        working-directory: miner

  scores:
    # Scoring runs on the network's schedule and the API exposes only the latest
    # epoch, so a score not captured when it appears is lost. This keeps a durable
    # per-epoch record to reason from instead of polling by hand.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record this epoch
        run: node tools/record-scores.mjs
      - name: Commit if new
        run: |
          if git diff --quiet -- docs/score-history.jsonl; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "Harshyadav442277"
          git config user.email "theageofprimes@gmail.com"
          git add docs/score-history.jsonl
          git commit -m "Record epoch scores"
          git push

# Uptime and routing watch.
#
# The rules require the miner to stay "live and operational throughout Track 3"
# (to 2026-09-07), and Telegraph revokes routing on a 20% score drop with no
# notification. This checks from outside our machine so a laptop being closed
# doesn't mean nobody is watching.
#
# Set these repository variables/secrets before enabling:
#   vars.MINER_BASE_URL    e.g. https://livecert.fly.dev
#   vars.REGISTRATION_ID   the id from the registerMiner receipt (once registered)

name: uptime

# Every 30 minutes from 2026-11-05 (owner: "i give you permission to take action on
# all of these"; GAPS G205). No commits: the record is the run history plus the
# `availability-*` artifacts. The heavier live-tests and scores jobs run on manual
# dispatch only, so an upstream blip in the test suite never reads as downtime.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Force the probe to fail, to prove the alarm path actually opens an issue"
        type: boolean
        default: false

jobs:
  availability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sweep every endpoint once
        env:
          MINER_BASE_URL: ${{ vars.MINER_BASE_URL }}
        run: node track1-miner/tools/availability.mjs "$MINER_BASE_URL" availability.jsonl
      - name: Keep the sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: availability-${{ github.run_id }}
          path: availability.jsonl
          retention-days: 90
          if-no-files-found: warn

  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Explicit, because the alarm depends on them: the issue-opening step needs
    # issues: write, and this had never been stated (or seen to work) before.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe the miner
        id: probe
        env:
          MINER_BASE_URL: ${{ vars.MINER_BASE_URL }}
          REGISTRATION_ID: ${{ vars.REGISTRATION_ID }}
        run: |
          if [ "${{ inputs.test_alarm }}" = "true" ]; then
            echo "test_alarm requested — failing deliberately to exercise the alarm path."
            exit 1
          fi
          if [ -z "$MINER_BASE_URL" ]; then
            echo "MINER_BASE_URL is not set — skipping. Set it once the miner is deployed."
            exit 0
          fi
          ARGS="--base-url $MINER_BASE_URL --once"
          if [ -n "$REGISTRATION_ID" ]; then ARGS="$ARGS --registration-id $REGISTRATION_ID"; fi
          node track1-miner/tools/watch.mjs $ARGS

      - name: Full acceptance check
        if: success() && vars.MINER_BASE_URL != ''
        run: node track1-miner/tools/verify-deploy.mjs "${{ vars.MINER_BASE_URL }}"

  live-tests:
    # The network-dependent half of the suite, on manual dispatch rather than
    # on every push, so an upstream blip never blocks a merge.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: track1-miner/miner/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: track1-miner/miner
      - run: npm run test:live
        working-directory: track1-miner/miner

  scores:
    # Scoring runs on the network's schedule and the API exposes only the latest
    # epoch, so a score not captured when it appears is lost. This keeps a durable
    # per-epoch artifact to reason from instead of polling by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record this epoch
        run: node track1-miner/tools/record-scores.mjs
      - name: Save score history without committing
        uses: actions/upload-artifact@v4
        with:
          name: score-history-${{ github.run_id }}
          path: track1-miner/docs/score-history.jsonl
          if-no-files-found: error

  alarm:
    # One alarm covering every job. Before this existed only `check` could open
    # an issue, so a live-test or score-recording failure was silent — and the
    # alarm path itself had never once been observed to fire (GAPS G21). Prove
    # it with: gh workflow run uptime --field test_alarm=true
    #
    # `resolve` below is the other half. Without it an alarm never clears, and
    # because this step reuses `existing[0]`, one stale issue silently downgrades
    # every later outage into a comment on a thread nobody is watching.
    needs: [availability, check, live-tests, scores]
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or extend the uptime issue
        uses: actions/github-script@v7
        with:
          script: |
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);
            const title = 'Miner health check failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime',
            });
            const body = `Failed jobs: ${failed.join(', ')} at ${new Date().toISOString()}.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Telegraph spot-checks each intent about once an hour, and consecutive failures revoke routing, ` +
              `so a failing endpoint is likely already costing score.`;
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['uptime'],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number, body,
              });
            }

  resolve:
    # The all-clear. badssl.com and Open-Meteo blip often enough that most alarms
    # are transient, and an alarm that never clears is worse than none: it leaves
    # a stale issue that suppresses the next real one into a comment. Closing on a
    # clean run keeps the alarm self-resetting, so an open `uptime` issue always
    # means "failing right now".
    needs: [availability, check, live-tests, scores]
    if: ${{ always() && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close any open uptime issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'uptime',
            });
            if (open.length === 0) {
              core.info('no open uptime issue; nothing to clear');
              return;
            }
            const results = Object.entries(${{ toJSON(needs) }})
              .map(([job, v]) => job + '=' + v.result).join(', ');
            const run = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            const body = [
              'Recovered at ' + new Date().toISOString() + ' — ' + results + '.',
              'Run: ' + run,
              'Closing so the next failure opens a fresh issue instead of commenting here.',
            ].join('\n\n');
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
              core.info('closed #' + issue.number);
            }
